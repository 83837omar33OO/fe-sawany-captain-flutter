name: Build & Release Fe-Sawany Captain APK

on:
  push:
    branches: [ "main", "master", "release/*" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Production Android APK (Cloud CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Print Flutter & Dart Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        run: flutter analyze --no-fatal-infos || true

      - name: Build Release APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Rename APK Artifacts for Clarity
        run: |
          mkdir -p release-apks
          cp build/app/outputs/flutter-apk/app-release.apk release-apks/FeSawany-Captain-Universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-apks/FeSawany-Captain-arm64.apk || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-apks/FeSawany-Captain-armeabi.apk || true

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FeSawany-Captain-Release-APKs
          path: release-apks/
          retention-days: 30

      - name: Create GitHub Release (On Push / Tag)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "كابتن في ثواني - إصدار v1.0.${{ github.run_number }}"
          body: |
            ## 🚀 تطبيق أسطول كباتن في ثواني (Fe-Sawany Captain)
            
            تم بناء هذا الإصدار سحابياً بنجاح عبر GitHub Actions.
            
            ### 📥 ملفات التثبيت المباشرة:
            - **[تحميل النسخة الشاملة (Universal APK)](./FeSawany-Captain-Universal.apk)**: تعمل على جميع الهواتف.
            - **نسخة arm64-v8a**: مخصصة للهواتف الحديثة لسرعة أعلى وحجم أخف.
            
            ### 📋 أبرز ما في هذا التحديث:
            - القفل الذري لمنع تعارض قبول الأوردرات (Atomic Claim).
            - الزر الدائري للحالة (متصل / غير متصل).
            - رادار الأوردرات الجديدة مع نغمة واهتزاز عالي.
            - حجب بيانات العميل قبل القبول وكشفها بعد القبول.
            - زر اتصال مباشر (Dialer) وملاحة Google Maps.
            - حاسبة العهدة النقدية والمحاسبة المزدوجة لأجر الكابتن.
          files: release-apks/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
