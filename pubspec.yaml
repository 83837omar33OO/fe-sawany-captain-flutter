name: fe_sawany_captain
description: "تطبيق أسطول كباتن وطيارين في ثواني - منصة التوصيل السريع"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking & Realtime
  http: ^1.2.2
  connectivity_plus: ^6.0.5

  # Storage & Caching
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Hardware, Location & Dialing
  geolocator: ^13.0.2
  battery_plus: ^6.2.1
  flutter_foreground_task: ^8.17.0
  url_launcher: ^6.3.0

  # Interactive Map (OpenStreetMap - Al Ameriya / Damanhour)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Utilities & UI
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/

dependency_overrides:
  geolocator_android: 4.6.1

